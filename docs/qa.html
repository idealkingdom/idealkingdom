<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio responsive QA</title><style>body{margin:0;background:#e9edf2;font:14px Arial,sans-serif;color:#202329}header{padding:12px 20px;background:#fff;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:14px}select{padding:8px;font:inherit}main{padding:24px;display:flex;justify-content:center;overflow:auto}iframe{display:block;width:375px;height:900px;flex-shrink:0;border:1px solid #cad0d9;background:#fff}</style></head><body><header><strong>Responsive layout check</strong><label for="width">Viewport</label><select id="width"><option value="320">320 px</option><option value="375" selected>375 px</option><option value="600">600 px</option><option value="768">768 px</option><option value="1024">1024 px</option><option value="1280">1280 px</option></select></header><main><iframe id="preview" title="Portfolio preview" src="index.html"></iframe></main><script>document.getElementById('width').addEventListener('change',function(){document.getElementById('preview').style.width=this.value+'px';});</script></body></html>
